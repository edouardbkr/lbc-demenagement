  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "fr-FR",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Le devis est-il vraiment gratuit ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, totalement gratuit et sans engagement. Vous décrivez votre déménagement, on revient sous 24h avec un prix clair et définitif. Aucune carte bancaire, aucun numéro surtaxé, aucune relance commerciale agressive."
      }
    },
    {
      "@type": "Question",
      "name": "Comment fixez-vous le prix ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sur trois critères objectifs : le volume à déménager (en m³), la distance entre les deux adresses, et la formule choisie (Coup de main, Mains libres ou Mains dans les poches). S'ajoutent les contraintes d'accès : étage, ascenseur, distance de portage, autorisation de stationnement. Le devis détaille chaque ligne — vous savez exactement ce que vous payez."
      }
    },
    {
      "@type": "Question",
      "name": "Le prix annoncé peut-il changer le jour J ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Non. Le prix du devis est le prix payé, point. La seule exception : si le volume réel diffère nettement de ce qui a été décrit (deux fois plus de cartons que prévu, un meuble « oublié » de 200 kg). C'est tout l'intérêt de bien décrire votre inventaire en amont."
      }
    },
    {
      "@type": "Question",
      "name": "Faut-il une visite à domicile ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pas obligatoirement. Pour les petits volumes, le formulaire en ligne et quelques photos suffisent. Pour un 3 pièces et plus, ou en présence d'objets lourds/précieux, on propose une visite sur place (gratuite) pour un devis au plus juste."
      }
    },
    {
      "@type": "Question",
      "name": "Y a-t-il des frais cachés (étage, monte-meuble) ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Non. Tout ce qui peut influer sur le prix — étage sans ascenseur, longue distance de portage, location d'un monte-meuble, autorisation de stationnement — est chiffré et visible dès le devis. Pas de mauvaise surprise sur la facture finale."
      }
    },
    {
      "@type": "Question",
      "name": "Quels sont les moyens et délais de paiement ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Carte, virement, chèque ou espèces. Un acompte est demandé à la réservation pour bloquer la date, le solde se règle à la fin de la prestation, une fois que tout est en place et que vous avez validé."
      }
    },
    {
      "@type": "Question",
      "name": "Mon déménagement est-il déductible ou aidé ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Dans certains cas oui : mutation professionnelle, déménagement lié à l'emploi, aides de la CAF ou d'Action Logement. On vous fournit une facture détaillée et conforme pour vos démarches."
      }
    },
    {
      "@type": "Question",
      "name": "Quelles sont vos formules ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Trois, du plus autonome au tout compris : Coup de main (l'essentiel), Mains libres (le confort, la plus demandée) et Mains dans les poches (le clé en main de A à Z). Chacune reprend la précédente et ajoute du service."
      }
    },
    {
      "@type": "Question",
      "name": "Que comprend la formule Coup de main ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "L'essentiel bien fait : transport avec véhicule adapté, chargement et déchargement par notre équipe, déménagement local ou longue distance, et assurance incluse. Vous préparez vos cartons, on gère le muscle, la route et la casse."
      }
    },
    {
      "@type": "Question",
      "name": "Que comprend la formule Mains libres ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tout le Coup de main, plus : emballage des objets fragiles par notre équipe, protection intégrale du mobilier (couvertures, housses, film), démontage et remontage des meubles, et manutention sécurisée. C'est notre formule la plus choisie."
      }
    },
    {
      "@type": "Question",
      "name": "Que comprend la formule Mains dans les poches ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le grand jeu : tout Mains libres, plus l'emballage de la totalité de vos cartons (objets fragiles compris), le déballage et la mise en place à l'arrivée, et une protection spécifique des objets précieux, œuvres d'art et vaisselle. Vous arrivez les mains dans les poches."
      }
    },
    {
      "@type": "Question",
      "name": "Quelle formule choisir ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Dans le doute, prenez Mains libres : c'est le meilleur rapport confort/prix pour la plupart des déménagements. On ajuste ensemble au moment du devis selon votre temps disponible et votre budget."
      }
    },
    {
      "@type": "Question",
      "name": "Puis-je changer de formule après le devis ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, tant que la logistique le permet. On réajuste le devis en conséquence, sans pénalité. Mieux vaut nous prévenir quelques jours avant le jour J pour caler l'équipe et le matériel."
      }
    },
    {
      "@type": "Question",
      "name": "À quelle heure arrive l'équipe ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "À l'heure convenue, avec une fenêtre de 15 minutes. On vous prévient en cas d'imprévu de circulation, mais la ponctualité fait partie de notre engagement — votre journée commence quand on l'a dit."
      }
    },
    {
      "@type": "Question",
      "name": "Combien de déménageurs interviennent ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cela dépend du volume et des accès : de 2 personnes pour un studio à 4–5 pour une grande maison. L'équipe et le camion sont dimensionnés au moment du devis pour tenir les délais sans précipitation."
      }
    },
    {
      "@type": "Question",
      "name": "Combien de temps dure un déménagement ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Un studio se boucle souvent en une demi-journée ; un 3 pièces en une journée ; une maison ou une longue distance peuvent demander deux jours. On vous donne une estimation horaire dès le devis."
      }
    },
    {
      "@type": "Question",
      "name": "Dois-je être présent le jour J ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Idéalement oui, ou un proche de confiance, pour ouvrir, indiquer les pièces à l'arrivée et valider en fin de prestation. Si vous ne pouvez pas, on s'organise avec un mandataire et un état des lieux précis."
      }
    },
    {
      "@type": "Question",
      "name": "Démontez-vous les meubles ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, dès la formule Mains libres : démontage au départ, remontage à l'arrivée. Lit, armoire, dressing, table — on s'occupe de tout, revissé comme il faut. La visserie est repérée et conservée pièce par pièce."
      }
    },
    {
      "@type": "Question",
      "name": "Et s'il pleut le jour J ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On déménage par tous les temps. Housses imperméables, protection des sols et des passages, le matériel est prévu pour. La pluie niçoise ne décale pas votre planning."
      }
    },
    {
      "@type": "Question",
      "name": "Que faites-vous des cartons vides ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sur demande, on repasse les récupérer après votre installation. Pas de montagne de cartons dans le salon pendant trois semaines."
      }
    },
    {
      "@type": "Question",
      "name": "Dois-je emballer moi-même mes cartons ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cela dépend de la formule. En Coup de main et Mains libres, vous préparez vos cartons (on protège le mobilier et on démonte). En Mains dans les poches, notre équipe emballe absolument tout pour vous, objets fragiles compris."
      }
    },
    {
      "@type": "Question",
      "name": "Fournissez-vous les cartons et le matériel ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui : cartons standards et penderies, papier bulle, couvertures, film étirable, adhésif. On peut vous les livrer avant le jour J pour que vous preniez de l'avance, ou tout apporter le jour même."
      }
    },
    {
      "@type": "Question",
      "name": "Comment protégez-vous les meubles fragiles ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Couvertures matelassées, housses, film plastique et cartons sur-mesure pour les angles et les écrans. Tout est calé et sanglé dans le camion pour qu'aucun meuble ne bouge sur la route."
      }
    },
    {
      "@type": "Question",
      "name": "Déménagez-vous un piano ou un coffre-fort ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui. Piano droit, piano à queue, coffre-fort : ce sont des charges lourdes et délicates qu'on transporte avec le matériel adapté (sangles, chariots, parfois monte-meuble) et une équipe renforcée. Signalez-les au devis pour qu'on prévoie le bon dispositif."
      }
    },
    {
      "@type": "Question",
      "name": "Et les objets très lourds (frigo américain, jacuzzi, billard) ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On en a l'habitude. Frigo américain, jacuzzi/spa, billard, baby-foot, appareils de sport : on les note à l'inventaire car ils pèsent et demandent un démontage ou une manutention spécifique. Mieux vaut les déclarer que de les découvrir le jour J."
      }
    },
    {
      "@type": "Question",
      "name": "Gérez-vous les œuvres d'art et la vaisselle précieuse ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, avec un emballage renforcé sur mesure (caisses, mousse, coins de protection) et une assurance valeur déclarée pour les pièces de grande valeur. C'est inclus en formule Mains dans les poches."
      }
    },
    {
      "@type": "Question",
      "name": "Transportez-vous les plantes et l'électroménager ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui pour les deux. L'électroménager est débranché, sécurisé et calé. Les plantes voyagent protégées — on vous conseille juste de ne pas les arroser la veille pour limiter le poids et les dégâts."
      }
    },
    {
      "@type": "Question",
      "name": "Mes affaires sont-elles assurées ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, une assurance multirisque est incluse dans chaque formule. Pour les objets de valeur (œuvres d'art, instruments, vaisselle précieuse), une couverture renforcée en valeur déclarée est disponible."
      }
    },
    {
      "@type": "Question",
      "name": "Et en cas de casse ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On le constate ensemble, on le déclare, et l'assurance prend le relais selon les plafonds prévus. Tout est écrit noir sur blanc dans le contrat — rien n'est laissé au hasard, et on ne casse jamais notre parole."
      }
    },
    {
      "@type": "Question",
      "name": "Qui réalise le déménagement ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nos équipes, formées et encadrées par les fondateurs Edouard et Anthony. Des professionnels présents du premier carton au dernier — jamais d'inconnu recruté la veille pour porter vos affaires."
      }
    },
    {
      "@type": "Question",
      "name": "Et si un meuble ne passe pas (escalier étroit, porte basse) ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On anticipe au devis grâce aux infos d'accès (étage, ascenseur, portage). Si besoin, on loue un monte-meuble pour passer par la fenêtre ou le balcon — chiffré à l'avance, jamais imposé en surprise."
      }
    },
    {
      "@type": "Question",
      "name": "Dans quelles villes intervenez-vous ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Toute la Côte d'Azur et la région PACA : Nice, Cannes, Antibes, Monaco, Menton, Grasse, Cagnes-sur-Mer, Saint-Laurent-du-Var, Vence, Mougins, Valbonne, Sophia Antipolis, Saint-Tropez, Fréjus… et bien au-delà."
      }
    },
    {
      "@type": "Question",
      "name": "Gérez-vous les déménagements longue distance ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Absolument. Nice–Paris, Nice–Lyon, Nice–Marseille, Nice–Bordeaux, Nice–Toulouse, Nice–Lille, Nice–Nantes : on organise le trajet, on optimise le camion et on tient les délais annoncés."
      }
    },
    {
      "@type": "Question",
      "name": "Intervenez-vous à Monaco ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, régulièrement. On connaît les contraintes de la Principauté : créneaux de livraison, accès des immeubles, stationnement réglementé. On gère les autorisations nécessaires."
      }
    },
    {
      "@type": "Question",
      "name": "Déménagez-vous à l'international ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, pour les destinations européennes principalement (Italie, Suisse, Espagne…). On s'occupe de la logistique, des formalités de transport et du suivi jusqu'à l'arrivée."
      }
    },
    {
      "@type": "Question",
      "name": "Et le stationnement à Nice ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On s'occupe des autorisations de stationnement auprès de la mairie. Vieux-Nice, Carré d'Or, Cimiez, Libération : on connaît les contraintes de chaque quartier et on réserve l'emplacement camion."
      }
    },
    {
      "@type": "Question",
      "name": "Gérez-vous les accès difficiles de l'arrière-pays ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui : villages perchés, ruelles étroites, chemins de traverse autour de Vence, Èze, Saint-Paul ou Tourrettes. On adapte la taille du camion et, si nécessaire, on fait la navette avec un véhicule plus petit."
      }
    },
    {
      "@type": "Question",
      "name": "Comment réserver une date ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Demandez votre devis en ligne ou par téléphone. Une fois le devis validé et l'acompte versé, la date est bloquée et vous recevez une confirmation écrite avec le déroulé du jour J."
      }
    },
    {
      "@type": "Question",
      "name": "Quel délai pour réserver ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Idéalement 2 à 3 semaines à l'avance, surtout en haute saison (juin à septembre) et en fin de mois. Mais on gère aussi les demandes plus serrées — appelez-nous, on trouve souvent une solution."
      }
    },
    {
      "@type": "Question",
      "name": "Gérez-vous les déménagements de dernière minute ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Souvent oui, selon nos disponibilités. Un imprévu, une date qui se libère : un coup de fil et on regarde tout de suite ce qu'on peut caler."
      }
    },
    {
      "@type": "Question",
      "name": "Puis-je annuler ou reporter ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui. Un report est gratuit s'il est signalé à l'avance ; en cas d'annulation tardive, seul l'acompte peut rester dû. Les conditions exactes figurent sur votre devis, en clair."
      }
    },
    {
      "@type": "Question",
      "name": "Proposez-vous du garde-meuble / stockage ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, en box sécurisé pour quelques jours comme pour plusieurs mois — pratique quand les dates d'entrée et de sortie ne coïncident pas. On vous chiffre le stockage avec le déménagement."
      }
    },
    {
      "@type": "Question",
      "name": "Travaillez-vous le week-end et les jours fériés ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, sur réservation. Les samedis et fins de mois partent vite, pensez à réserver tôt. Les dimanches et fériés sont possibles selon les villes."
      }
    },
    {
      "@type": "Question",
      "name": "Faut-il vider les meubles (tiroirs, penderie) ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui pour la plupart : commodes, bureaux, placards doivent être vidés pour le transport (sécurité et poids). On vous fournit des cartons-penderie pour les vêtements sur cintres, qui voyagent prêts à raccrocher."
      }
    },
    {
      "@type": "Question",
      "name": "Faites-vous du déménagement d'entreprise ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui : bureaux, commerces, locaux professionnels. On planifie souvent en soirée ou le week-end pour limiter l'interruption d'activité, avec un interlocuteur dédié du début à la fin."
      }
    }
  ]
}
